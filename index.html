<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Phả Dòng Họ</title>

  <!-- Thẻ hiển thị ảnh & thông tin xem trước khi gửi tin nhắn -->
  <meta property="og:title" content="Gia Phả - Kết nối cội nguồn, gìn giữ truyền thống" />
  <meta property="og:description" content="Hệ thống quản lý cây gia phả dòng họ trực tuyến đa thế hệ." />
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1RGVYl9BvPRCxLGJ_lislwHvyGF3ZLGsz" />

  <!-- Tự động nhảy sang Web App Google Apps Script sau 1.5 giây để kịp hiển thị hiệu ứng -->
  <meta http-equiv="refresh" content="1.5; url=https://script.google.com/macros/s/AKfycbzxw2MtB70-a_S62Y1zmORnfqJHh-sQ-aXY_G0bXrFm-sJ3qAfAiR3f5Rbs-f-ijmuYXg/exec">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 400px;
      width: 90%;
      animation: fadeIn 0.8s ease-out;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #38bdf8;
      border-radius: 50%;
      margin: 0 auto 24px auto;
      animation: spin 1s linear infinite;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f1f5f9;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    .link-fallback {
      margin-top: 20px;
      display: inline-block;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .link-fallback:hover {
      text-decoration: underline;
      color: #7dd3fc;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h1>Gia Phả Dòng Họ</h1>
    <p>Đang kết nối đến hệ thống gia phả, vui lòng đợi trong giây lát...</p>
    
    <a href="https://script.google.com/macros/s/AKfycbzxw2MtB70-a_S62Y1zmORnfqJHh-sQ-aXY_G0bXrFm-sJ3qAfAiR3f5Rbs-f-ijmuYXg/exec" class="link-fallback">
      Nhấn vào đây nếu trang không tự chuyển hướng
    </a>
  </div>

</body>
</html>
